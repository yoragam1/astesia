name: astesia-gate

# Trust Pyramid Layer 2: Deterministic enforcement gate.
# Uses trusted gate script and rules from base branch to evaluate incoming PR code.
# Copy to .github/workflows/astesia-gate.yml.

on:
  pull_request:
    branches: [main]

concurrency:
  group: astesia-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Checkout incoming pull request code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1

      - name: Validate PR Workflow Security Guard
        run: |
          WORKFLOW_FILE=""
          if [ -f "pr/.github/workflows/astesia-gate.yml" ]; then
            WORKFLOW_FILE="pr/.github/workflows/astesia-gate.yml"
          elif [ -f "pr/templates/enforcement/astesia-gate.workflow.yml" ]; then
            WORKFLOW_FILE="pr/templates/enforcement/astesia-gate.workflow.yml"
          fi
          if [ -z "$WORKFLOW_FILE" ]; then
            echo "[SECURITY_ERROR: No PR workflow found to validate (fail-closed)]"
            exit 1
          fi
          GATE_SCRIPT=""
          if [ -f "trusted/.astesia/enforcement/astesia-gate.ts" ]; then
            GATE_SCRIPT="trusted/.astesia/enforcement/astesia-gate.ts"
          elif [ -f "trusted/templates/enforcement/astesia-gate.ts" ]; then
            GATE_SCRIPT="trusted/templates/enforcement/astesia-gate.ts"
          fi
          if [ -z "$GATE_SCRIPT" ]; then
            echo "[SECURITY_ERROR: Trusted gate script not found (fail-closed)]"
            exit 1
          fi
          bun "$GATE_SCRIPT" --check-workflow "$WORKFLOW_FILE"

      - name: Verify anti-pattern registry compatibility (no weakenings)
        run: |
          bun trusted/.astesia/enforcement/astesia-gate.ts --rules-diff trusted/.astesia/anti-patterns.json pr/.astesia/anti-patterns.json

      - name: Execute trusted gate on incoming code
        run: |
          CONFIG_ARG=""
          if [ -f "trusted/.astesia/gate-config.json" ]; then
            CONFIG_ARG="--config trusted/.astesia/gate-config.json"
          fi
          
          BASELINE_ARG=""
          if [ -f "trusted/.astesia/gate-baseline.json" ]; then
            BASELINE_ARG="--baseline trusted/.astesia/gate-baseline.json"
          fi
          
          bun trusted/.astesia/enforcement/astesia-gate.ts \
            --root pr \
            --rules trusted/.astesia/anti-patterns.json \
            $CONFIG_ARG \
            $BASELINE_ARG \
            --max-warn 0 \
            --json
